<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knight Tournament — TV Screen</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="tvStage">

<div id="prizeToast" class="prizeBanner hidden">
<div class="prizeBannerInner" id="prizeToastText">PRIZE CLAIMED!</div>
</div>

<div id="screenWaiting" class="tvScreen waitingFullScreen">
<canvas id="waitingCanvas" width="1864" height="1040"></canvas>
<div class="waitingHeroOverlay">
<div class="waitingBrand" id="waitingBrandText">KNIGHT TOURNAMENT</div>
<div class="waitingLogoPlaque">
<img src="assets/aistudio/rowan-events-option-1_004e6aed.svg" alt="Rowan Events" class="waitingBigLogo">
</div>
<div class="waitingStartBtns">
<button type="button" class="waitingBigBtn" id="btnTvFullscreen">⛶ FULLSCREEN</button>
<button type="button" class="waitingBigBtn" id="btnTvSound">🔊 SOUND</button>
</div>
</div>
</div>

<div id="screenParade" class="tvScreen hidden">
<div class="paradeHeaderBanner">
<div class="paradeKicker" id="paradeStepBadge"></div>
<div class="paradeMainTitle" id="paradeHeroName"></div>
<div class="paradeSubTitle" id="paradeHeroDetails"></div>
</div>

<div class="paradeCanvasWrap">
<canvas id="paradeCanvas" width="1860" height="536"></canvas>
</div>

<div class="paradeLineupGrid" id="paradeLineupRow"></div>
</div>

<div id="screenBracket" class="tvScreen hidden">
<div class="bracketArea">

<div class="bracketCol colLeftQF">
<div class="colHeader" id="colHeadQfWest"></div>
<div class="matchBox" id="matchBox0"></div>
<div class="matchBox" id="matchBox1"></div>
</div>

<div class="bracketCol colLeftSF">
<div class="colHeader" id="colHeadSfLeft"></div>
<div class="matchBox sfBox" id="matchBox4"></div>
</div>

<div class="bracketCenter">
<div class="finalBoxWrap">
<div class="colHeader finalHeader" id="colHeadFinal"></div>
<div class="matchBox finalBox" id="matchBox6"></div>
</div>

<div class="nextBoutCard" id="nextBoutPanel">
<div class="boutCardHeader">
<span id="nextBoutTitle"></span>
<span id="liveBetIndicator" class="liveTag"></span>
</div>
<div class="boutVsRow">
<div class="boutFighter leftFighter">
<canvas id="previewCanvasLeft" width="360" height="240"></canvas>
<div class="fName" id="pLeftName"></div>
<div class="fRecord" id="pLeftRec">W: 0 / L: 0</div>
<div class="fOddsBox">
<span class="oddsValue" id="pLeftOdds"></span>
<span class="outrightSub" id="pLeftOutright"></span>
</div>
</div>

<div class="vsCenterCol" id="vsCenterCol">
<div class="poolInfo hidden" id="matchPoolText"></div>
<div class="betsList hidden" id="activeBetsList"></div>
<div class="h2hBadge hidden" id="h2hScoreBox"></div>
<div class="vsBadge">VS</div>
</div>

<div class="boutFighter rightFighter">
<canvas id="previewCanvasRight" width="360" height="240"></canvas>
<div class="fName" id="pRightName"></div>
<div class="fRecord" id="pRightRec">W: 0 / L: 0</div>
<div class="fOddsBox">
<span class="oddsValue" id="pRightOdds"></span>
<span class="outrightSub" id="pRightOutright"></span>
</div>
</div>
</div>
</div>

<div id="championRevealCard" class="champCard hidden">
<div class="champKicker" id="champKickerText"></div>
<div class="champRoyalTitle" id="champSecretTitle"></div>
<div class="champSirName" id="champNameText"></div>
<div class="champLore" id="champNoticeText"></div>
</div>
</div>

<div class="bracketCol colRightSF">
<div class="colHeader" id="colHeadSfRight"></div>
<div class="matchBox sfBox" id="matchBox5"></div>
</div>

<div class="bracketCol colRightQF">
<div class="colHeader" id="colHeadQfEast"></div>
<div class="matchBox" id="matchBox2"></div>
<div class="matchBox" id="matchBox3"></div>
</div>

</div>
</div>

<div id="screenCombat" class="tvScreen hidden">
<div class="combatHudTop">
<div class="combatFighterHud leftHud">
<div class="cHudName" id="cLeftName"></div>
<div class="cHudSub" id="cLeftSub"></div>
<div class="cHudStatus" id="cLeftStatus"></div>
</div>

<div class="combatCenterHud">
<div class="combatPassTitle" id="combatPassBadge"></div>
<div class="combatLiveOddsRow">
<span class="cOddsPill leftOddsPill" id="cLeftLiveOdds"></span>
<span class="cPhaseNote" id="combatSubNote"></span>
<span class="cOddsPill rightOddsPill" id="cRightLiveOdds"></span>
</div>
</div>

<div class="combatFighterHud rightHud">
<div class="cHudName" id="cRightName"></div>
<div class="cHudSub" id="cRightSub"></div>
<div class="cHudStatus" id="cRightStatus"></div>
</div>
</div>

<div class="arenaCanvasWrap">
<canvas id="arenaCanvas" width="1800" height="620"></canvas>
<div id="combatOverlayBanner" class="arenaBanner hidden">
<div class="arenaBannerTitle" id="arenaBannerMain">LIVE BETTING PAUSE!</div>
<div class="arenaBannerSub" id="arenaBannerDetail">Odds updated</div>
</div>
</div>
</div>

<div class="bottomBar" id="tvBottomBar">
<div class="tablesPanel">
<div class="panelLabel" id="tablesTitle">PUB TABLES (CAPS BALANCE):</div>
<div class="tablesList" id="tablesRow"></div>
</div>
<div class="prizesPanel">
<div class="panelLabel" id="prizesTitle">PUB PRIZE SHOWCASE:</div>
<div class="prizesList" id="prizesRow"></div>
</div>
</div>

</div>

<button type="button" id="secretHostTap" class="secretHostBtn" aria-label="Debug Host Access"></button>

<script src="js/i18n.js"></script>
<script src="js/tvscale.js"></script>
<script src="js/sound.js"></script>
<script src="js/art.js"></script>
<script src="js/main.js"></script>
</body>
</html>
